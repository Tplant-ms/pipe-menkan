<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>配管計算ツール</title>
<style>
:root{
  --paper:       #F3EFE6;
  --paper-line:  #D9D2BF;
  --ink:         #16324F;
  --ink-soft:    #4A6178;
  --blueprint:   #1B3A5C;
  --blueprint-deep: #0F2843;
  --accent:      #C1541F;
  --accent-soft: #F0DCC9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  min-height:100vh;
}
.hdr{
  background:var(--blueprint);
  border-bottom:4px solid var(--accent);
  padding:16px 20px;
  text-align:center;
}
.hdr h1{
  color:#fff;
  font-size:1.15rem;
  font-weight:700;
  letter-spacing:.08em;
}
.hdr p{
  color:#aac4df;
  font-size:.75rem;
  margin-top:4px;
}
.wrap{
  max-width:560px;
  margin:0 auto;
  padding:24px 16px 32px;
}
.section-label{
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink-soft);
  border-bottom:1px solid var(--paper-line);
  padding-bottom:6px;
  margin-bottom:16px;
}
.tool-grid{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.tool-card{
  display:flex;
  align-items:center;
  gap:16px;
  background:#fff;
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  padding:18px 20px;
  text-decoration:none;
  color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.tool-card:hover{
  border-color:var(--blueprint);
  box-shadow:0 2px 8px rgba(27,58,92,.15);
}
.tool-icon{
  font-size:2rem;
  line-height:1;
  flex-shrink:0;
}
.tool-body{}
.tool-name{
  font-size:.95rem;
  font-weight:700;
  color:var(--blueprint);
}
.tool-desc{
  font-size:.78rem;
  color:var(--ink-soft);
  margin-top:4px;
  line-height:1.5;
}
.arrow{
  margin-left:auto;
  font-size:1.1rem;
  color:var(--paper-line);
  flex-shrink:0;
}
.tool-card:hover .arrow{
  color:var(--blueprint);
}
.site-nav{
  background:var(--blueprint);
  border-top:3px solid var(--blueprint-deep);
  padding:12px 16px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}
.site-nav a{
  color:#aac4df;
  font-size:.78rem;
  text-decoration:none;
  padding:6px 14px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:4px;
  transition:all .15s;
}
.site-nav a:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.site-nav a.current{color:#fff;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.1);pointer-events:none}
</style>
</head>
<body>

<div class="hdr">
  <h1>配管計算ツール</h1>
  <p>Piping Calculation Tools</p>
</div>

<div class="wrap">
  <div class="section-label">ツール一覧</div>
  <div class="tool-grid">

    <a class="tool-card" href="pipe-cutting.html">
      <div class="tool-icon">✂️</div>
      <div class="tool-body">
        <div class="tool-name">面間計算</div>
        <div class="tool-desc">継手・フランジ組み合わせの切断寸法を自動計算</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tool-card" href="pipe-weight.html">
      <div class="tool-icon">⚖️</div>
      <div class="tool-body">
        <div class="tool-name">重量計算</div>
        <div class="tool-desc">材質・サイズ・長さから配管重量を計算（SGP／STPG／SUS）</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tool-card" href="flange-bolt.html">
      <div class="tool-icon">🔩</div>
      <div class="tool-body">
        <div class="tool-name">ボルト寸法</div>
        <div class="tool-desc">フランジ規格からボルト長さ・ガスケット寸法を確認</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tool-card" href="cast-iron-weight.html">
      <div class="tool-icon">🏭</div>
      <div class="tool-body">
        <div class="tool-name">鋳鉄管拾い出し</div>
        <div class="tool-desc">鋳鉄管の重量を拾い出し・積算（処理場内配管用）</div>
      </div>
      <div class="arrow">›</div>
    </a>

  </div>
</div>

<nav class="site-nav">
  <a href="index.html" class="current">🏠 トップ</a>
  <a href="pipe-cutting.html">✂️ 面間計算</a>
  <a href="pipe-weight.html">⚖️ 重量計算</a>
  <a href="flange-bolt.html">🔩 ボルト寸法</a>
  <a href="cast-iron-weight.html">🏭 鋳鉄管拾い出し</a>
</nav>

</body>
</html>
